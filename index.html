<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pikachu game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="wrap-game">
            <table class="board-game"></table>
            <canvas id="paint"></canvas>
        </div>
        <div class="right">
            <h1>Game Pikachu</h1>
            <div id="clock">Hãy chơi thật nhiệt huyết</div>
            <button class="help-me">Help me: 10 lần</button>
            <div class="levels">
                <button class="btn-lv" id="level1">Level 1</button>
                <button class="btn-lv" id="level2">Level 2</button>
                <button class="btn-lv" id="level3">Level 3</button>
                <button class="btn-lv" id="level4">Level 4</button>
                <button class="btn-lv" id="level5">Level 5</button>
                <button class="btn-lv" id="level6">Level 6</button>
            </div>
        </div>
        <script src="util.js"></script>
        <script src="game.js"></script>
        <script src="controller.js"></script>
    </div>
</body>
</html>
